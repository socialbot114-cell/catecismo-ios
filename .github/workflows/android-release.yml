name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing files
        env:
          CATECISMO_ANDROID_KEYSTORE_BASE64: ${{ secrets.CATECISMO_ANDROID_KEYSTORE_BASE64 }}
          CATECISMO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CATECISMO_ANDROID_KEYSTORE_PASSWORD }}
          CATECISMO_ANDROID_KEY_PASSWORD: ${{ secrets.CATECISMO_ANDROID_KEY_PASSWORD }}
          CATECISMO_ANDROID_KEY_ALIAS: ${{ secrets.CATECISMO_ANDROID_KEY_ALIAS }}
        run: |
          for name in CATECISMO_ANDROID_KEYSTORE_BASE64 CATECISMO_ANDROID_KEYSTORE_PASSWORD CATECISMO_ANDROID_KEY_PASSWORD CATECISMO_ANDROID_KEY_ALIAS; do
            test -n "${!name:-}" || { echo "Missing Catecismo signing secret: $name" >&2; exit 1; }
          done
          printf '%s' "$CATECISMO_ANDROID_KEYSTORE_BASE64" | base64 --decode > catecismo-release.keystore
          chmod 600 catecismo-release.keystore
          printf 'storeFile=catecismo-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$CATECISMO_ANDROID_KEYSTORE_PASSWORD" "$CATECISMO_ANDROID_KEY_ALIAS" "$CATECISMO_ANDROID_KEY_PASSWORD" > keystore.properties
          chmod 600 keystore.properties
      - name: Validate and build release
        run: |
          python3 tools/validate_assets.py
          ./gradlew :shared:jvmTest testDebugUnitTest lintDebug bundleRelease
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: catecismo-release-aab
          path: app/build/outputs/bundle/release/*.aab
