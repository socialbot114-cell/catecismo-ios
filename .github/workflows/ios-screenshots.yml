name: Catecismo iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    strategy:
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
          - name: iPad Air 13-inch (M4)
            slug: ipad
    steps:
      - uses: actions/checkout@v4
      - name: Validate app assets
        run: python3 tools/validate_ios_assets.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate
      - name: Capture screenshots
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme Catecismo \
            -destination 'platform=iOS Simulator,name=${{ matrix.device.name }},OS=26.5' \
            -resultBundlePath "$RUNNER_TEMP/catecismo-${{ matrix.device.slug }}.xcresult" \
            -only-testing:CatecismoUITests \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/catecismo-screenshots"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/catecismo-${{ matrix.device.slug }}.xcresult" \
            --output-path "$RUNNER_TEMP/catecismo-screenshots-${{ matrix.device.slug }}"
      - name: Normalize to store dimensions
        run: |
          set -euo pipefail
          if [ "${{ matrix.device.slug }}" = "iphone" ]; then
            target_w=1242; target_h=2688
          else
            target_w=2064; target_h=2752
          fi
          echo "Normalizing ${{ matrix.device.slug }} screenshots to ${target_w}x${target_h}"
          find "$RUNNER_TEMP/catecismo-screenshots-${{ matrix.device.slug }}" -type f -name '*.png' -print0 | while IFS= read -r -d '' img; do
            sips -z "$target_h" "$target_w" "$img" >/dev/null
          done
          find "$RUNNER_TEMP/catecismo-screenshots-${{ matrix.device.slug }}" -type f -name '*.png' -exec sips -g pixelWidth -g pixelHeight {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: catecismo-ios-1.1.1-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/catecismo-screenshots-${{ matrix.device.slug }}
