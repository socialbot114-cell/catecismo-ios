name: Catecismo iOS Screenshots (auditoria 1.2.1)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Observação da auditoria"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    strategy:
      matrix:
        device:
          - name: iPhone 16
            slug: iphone
            family: iPhone
          - name: iPad Air 13-inch (M2)
            slug: ipad
            family: iPad
    steps:
      - uses: actions/checkout@v4
      - name: Validate iOS resources
        run: python3 tools/validate_ios_assets.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate
      - name: Find available simulator
        id: simulator
        env:
          SIMULATOR_FAMILY: ${{ matrix.device.family }}
          PREFERRED_SIMULATOR: ${{ matrix.device.name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          inventory = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          family = os.environ["SIMULATOR_FAMILY"]
          preferred = os.environ["PREFERRED_SIMULATOR"]
          candidates = []
          for runtime, devices in inventory["devices"].items():
              if not runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-"):
                  continue
              for device in devices:
                  if family in device["name"]:
                      version = tuple(
                          int(part) for part in runtime.split(".iOS-", 1)[1].split("-")
                      )
                      candidates.append((version, device["name"] != preferred, device))

          if not candidates:
              sys.exit(f"No available {family} simulator found")

          _, _, selected = max(candidates, key=lambda candidate: (candidate[0], not candidate[1]))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"udid={selected['udid']}\n")
              output.write(f"name={selected['name']}\n")
          print(f"Selected {selected['name']} ({selected['udid']})")
          PY
      - name: Capture screenshots
        working-directory: iosApp
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          test_status=0
          xcodebuild test \
            -scheme Catecismo \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/catecismo-${{ matrix.device.slug }}.xcresult" \
            -only-testing:CatecismoUITests \
            CODE_SIGNING_ALLOWED=NO || test_status=$?
          screenshot_dir="$RUNNER_TEMP/catecismo-screenshots-${{ matrix.device.slug }}"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/catecismo-${{ matrix.device.slug }}.xcresult" \
            --output-path "$screenshot_dir" || export_status=$?
          mkdir -p "$screenshot_dir"
          if [ -f "$screenshot_dir/manifest.json" ]; then
            python3 - "$screenshot_dir" <<'PY'
          import json
          import re
          import shutil
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          named = root / "named"
          named.mkdir(exist_ok=True)
          for test in manifest:
              for attachment in test.get("attachments", []):
                  source = root / attachment["exportedFileName"]
                  if source.suffix.lower() != ".png":
                      continue
                  suggested = attachment.get("suggestedHumanReadableName", source.name)
                  stem = Path(suggested).stem
                  stem = re.sub(r"_\d+_[0-9A-Fa-f-]+$", "", stem)
                  destination = named / f"{stem}{source.suffix}"
                  shutil.copy2(source, destination)
          print(f"Named {len(list(named.glob('*.png')))} screenshots in {named}")
          PY
          fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if [ "${export_status:-0}" -ne 0 ]; then exit "$export_status"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catecismo-ios-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/catecismo-screenshots-${{ matrix.device.slug }}
          retention-days: 30
