name: Catecismo iOS Screenshots (auditoria 1.2.1)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Observação da auditoria"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    strategy:
      matrix:
        device:
          - name: iPhone 16
            slug: iphone
          - name: iPad Air 13-inch (M2)
            slug: ipad
    steps:
      - uses: actions/checkout@v4
      - name: Validate iOS resources
        run: python3 tools/validate_ios_assets.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate
      - name: Install iOS Simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes
          xcrun simctl list devices available
      - name: Capture screenshots
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme Catecismo \
            -destination 'platform=iOS Simulator,name=${{ matrix.device.name }},OS=latest' \
            -resultBundlePath "$RUNNER_TEMP/catecismo-${{ matrix.device.slug }}.xcresult" \
            -only-testing:CatecismoUITests \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/catecismo-screenshots"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/catecismo-${{ matrix.device.slug }}.xcresult" \
            --output-path "$RUNNER_TEMP/catecismo-screenshots-${{ matrix.device.slug }}"
      - uses: actions/upload-artifact@v4
        with:
          name: catecismo-ios-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/catecismo-screenshots-${{ matrix.device.slug }}
          retention-days: 30
