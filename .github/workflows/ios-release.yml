name: Catecismo iOS App Store

on:
  workflow_dispatch:
    inputs:
      confirm_app_store_submission:
        description: Submit this build to App Review and release automatically after approval
        type: boolean
        required: true
        default: false
      previous_tests_passed:
        description: Skip XCTest only when this unchanged source already passed XCTest on a prior run
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate content
        run: |
          python3 tools/validate_ios_assets.py
          python3 - <<'PY'
          import json
          import plistlib
          from pathlib import Path
          root = Path('iosApp')
          info = plistlib.load((root / 'Info.plist').open('rb'))
          assert info['CFBundleShortVersionString'] == '1.2.2'
          assert info['CFBundleVersion'] == '32'
          plistlib.load((root / 'Resources/PrivacyInfo.xcprivacy').open('rb'))
          texts = list((root / 'Resources/Texts').glob('*.json'))
          assert len(texts) == 12
          project = (root / 'project.yml').read_text()
          assert 'MARKETING_VERSION: "1.2.2"' in project
          assert 'CURRENT_PROJECT_VERSION: "32"' in project
          assert 'CFBundleShortVersionString: "1.2.2"' in project
          assert 'CFBundleVersion: "32"' in project
          forbidden = ('machado', 'dom casmurro', 'br.com.machadodeassis')
          for path in root.rglob('*'):
              if path.is_file() and path.suffix in {'.swift', '.json', '.plist', '.yml', '.md'}:
                  assert not any(item in path.read_text(errors='ignore').lower() for item in forbidden), path
          print('Catecismo release content passed')
          PY

      - name: Validate required secrets
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_DISTRIBUTION_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          APPLE_DISTRIBUTION_KEY: ${{ secrets.APPLE_DISTRIBUTION_KEY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_DISTRIBUTION_CERT APPLE_DISTRIBUTION_KEY APPLE_PROVISIONING_PROFILE; do
            test -n "${!name:-}" || { echo "Missing secret: $name" >&2; exit 1; }
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml

      - name: Select available iPhone simulator
        id: simulator
        env:
          SIMULATOR_FAMILY: iPhone
          PREFERRED_SIMULATOR: iPhone 16
        run: python3 tools/select_ios_simulator.py

      - name: Run XCTest
        if: ${{ inputs.previous_tests_passed != true }}
        working-directory: iosApp
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test \
            -project Catecismo.xcodeproj \
            -scheme Catecismo \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Install signing assets
        env:
          APPLE_DISTRIBUTION_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          APPLE_DISTRIBUTION_KEY: ${{ secrets.APPLE_DISTRIBUTION_KEY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_DISTRIBUTION_CERT" | base64 --decode > "$RUNNER_TEMP/distribution.cer"
          printf '%s' "$APPLE_DISTRIBUTION_KEY" | base64 --decode > "$RUNNER_TEMP/distribution.key"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$app_identifier" = "$team_id.br.com.CATECISMO.DAIGREJACAToLICA"
          printf 'PROFILE_NAME=%s\nTEAM_ID=%s\n' "$profile_name" "$team_id" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.key" -k "$keychain" -P '' -A -T /usr/bin/codesign
          security import "$RUNNER_TEMP/distribution.cer" -k "$keychain" -P '' -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

      - name: Archive
        working-directory: iosApp
        run: |
          xcodebuild archive \
            -project Catecismo.xcodeproj \
            -scheme Catecismo \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Catecismo.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION=1.2.2 \
            CURRENT_PROJECT_VERSION=32

      - name: Validate archive version
        run: |
          app="$RUNNER_TEMP/Catecismo.xcarchive/Products/Applications/Catecismo.app"
          short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          build_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          printf 'Archive version=%s build=%s\n' "$short_version" "$build_version"
          test "$short_version" = '1.2.2'
          test "$build_version" = '32'

      - name: Export IPA
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist').open('wb') as file:
              plistlib.dump({'method': 'app-store', 'signingStyle': 'manual', 'teamID': os.environ['TEAM_ID'], 'manageAppVersionAndBuildNumber': False, 'provisioningProfiles': {'br.com.CATECISMO.DAIGREJACAToLICA': os.environ['PROFILE_NAME']}}, file)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Catecismo.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Validate and upload artifact
        run: |
          set -euxo pipefail
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          test -f "${ipa[0]}"
          unzip -q "${ipa[0]}" -d "$RUNNER_TEMP/ipa"
          app=("$RUNNER_TEMP"/ipa/Payload/*.app)
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app[0]}/Info.plist")
          short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app[0]}/Info.plist")
          build_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${app[0]}/Info.plist")
          printf 'Exported bundle=%s version=%s build=%s\n' "$bundle_id" "$short_version" "$build_version"
          test "$bundle_id" = 'br.com.CATECISMO.DAIGREJACAToLICA'
          test "$short_version" = '1.2.2'
          test "$build_version" = '32'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "${app[0]}/Info.plist")" = 'audio'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIUserInterfaceStyle' "${app[0]}/Info.plist")" = 'Light'
          test -f "${app[0]}/PrivacyInfo.xcprivacy"
          test "$(find "${app[0]}" -name '*.json' | wc -l | tr -d ' ')" -ge 12
          codesign --verify --deep --strict --verbose=4 "${app[0]}" || {
            codesign --display --verbose=4 "${app[0]}" 2>&1 || true
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: catecismo-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'app-store-connect-api-key.json'
          path.write_text(json.dumps({
              'key_id': os.environ['APPLE_API_KEY_ID'],
              'issuer_id': os.environ['APPLE_API_ISSUER_ID'],
              'key': os.environ['APPLE_API_KEY_P8'],
              'in_house': False,
          }))
          PY

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Upload build, metadata, and submit for App Review
        env:
          SUBMIT_FOR_REVIEW: ${{ inputs.confirm_app_store_submission }}
        run: |
          set -euo pipefail
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          args=(
            deliver
            --ipa "${ipa[0]}"
            --api_key_path "$RUNNER_TEMP/app-store-connect-api-key.json"
            --app_identifier 'br.com.CATECISMO.DAIGREJACAToLICA'
            --app_version '1.2.2'
            --metadata_path 'store-kit/metadata'
            --skip_screenshots
            --precheck_include_in_app_purchases false
            --force
          )
          if [[ "$SUBMIT_FOR_REVIEW" == 'true' ]]; then
            args+=(--submit_for_review --automatic_release)
          fi
          fastlane "${args[@]}"
