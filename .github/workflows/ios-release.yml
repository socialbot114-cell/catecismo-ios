name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Install distribution signing assets
        env:
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          test -n "$APPLE_DISTRIBUTION_CERT_P12"
          test -n "$APPLE_PROVISIONING_PROFILE"
          printf '%s' "$APPLE_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/MachadoBiblioteca.mobileprovision"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$HOME/Library/Keychains/login.keychain-db" \
            -P "" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/MachadoBiblioteca.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/58bd6b96-dfde-4d4b-9807-9a4d35a45eeb.mobileprovision"
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml
      - name: Archive signed app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcodebuild \
            -project iosApp/MachadoBiblioteca.xcodeproj \
            -scheme MachadoBiblioteca \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MachadoBiblioteca.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Machado Biblioteca App Store 2026" \
            DEVELOPMENT_TEAM=SRN7AW424S \
            archive
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MachadoBiblioteca.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: machado-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          test -f "${ipa[0]}"
          xcrun altool --upload-app \
            --type ios \
            --file "${ipa[0]}" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
