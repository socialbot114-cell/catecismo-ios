name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml
      - name: Archive signed app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcodebuild \
            -project iosApp/MachadoBiblioteca.xcodeproj \
            -scheme MachadoBiblioteca \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MachadoBiblioteca.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=SRN7AW424S \
            archive
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MachadoBiblioteca.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: machado-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          test -f "${ipa[0]}"
          xcrun altool --upload-app \
            --type ios \
            --file "${ipa[0]}" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
