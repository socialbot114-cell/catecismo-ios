name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml
      - name: Normalize project format for runner Xcode
        run: perl -0pi -e 's/objectVersion = 77;/objectVersion = 60;/g; s/Xcode 16\.0/Xcode 15.0/g' iosApp/MachadoBiblioteca.xcodeproj/project.pbxproj
      - name: Build simulator target
        run: xcodebuild -project iosApp/MachadoBiblioteca.xcodeproj -scheme MachadoBiblioteca -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
