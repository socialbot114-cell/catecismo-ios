name: Catecismo iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main, revamp/catecismo-ios-1.1, socialbot114-cell/pufferfish]
  pull_request:
    branches: [main, revamp/catecismo-ios-1.1, socialbot114-cell/pufferfish]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local content and identity
        run: |
          python3 tools/validate_ios_assets.py
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          root = Path('iosApp')
          info = plistlib.loads((root / 'Info.plist').read_bytes())
          assert info['CFBundleDisplayName'] == 'Catecismo'
          assert 'CATECISMO.DAIGREJACAToLICA' in (root / 'project.yml').read_text()
          plistlib.loads((root / 'Resources/PrivacyInfo.xcprivacy').read_bytes())
          PY

  build:
    runs-on: macos-15
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate
      - name: Test
        working-directory: iosApp
        run: |
          xcodebuild test \
            -scheme Catecismo \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath "$RUNNER_TEMP/catecismo-ci.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/catecismo-ci.xcresult" \
            --output-path "$RUNNER_TEMP/catecismo-ci-screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: catecismo-ios-ci-screenshots
          path: ${{ runner.temp }}/catecismo-ci-screenshots
          retention-days: 30
