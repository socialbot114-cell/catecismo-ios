name: Catecismo
options:
  bundleIdPrefix: br.com.CATECISMO
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: br.com.CATECISMO.DAIGREJACAToLICA
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "16"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    CODE_SIGN_STYLE: Automatic
targets:
  Catecismo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Images
        type: folder
        buildPhase: resources
      - path: Resources/catalog.json
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Texts/o-dom-da-fe.json
        buildPhase: resources
      - path: Resources/Texts/credo-em-caminho.json
        buildPhase: resources
      - path: Resources/Texts/sinais-da-graca.json
        buildPhase: resources
      - path: Resources/Texts/liberdade-e-amor.json
        buildPhase: resources
      - path: Resources/Texts/escola-da-oracao.json
        buildPhase: resources
      - path: Resources/Texts/a-igreja-viva.json
        buildPhase: resources
      - path: Resources/Texts/maria-e-o-sim.json
        buildPhase: resources
      - path: Resources/Texts/conversao-diaria.json
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "16"
        INFOPLIST_KEY_CFBundleDisplayName: Catecismo
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        PRIVACY_MANIFEST_FILE: Resources/PrivacyInfo.xcprivacy
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - CatecismoTests
        - CatecismoUITests
  CatecismoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Catecismo
  CatecismoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Catecismo
