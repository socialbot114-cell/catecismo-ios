name: Catecismo
options:
  bundleIdPrefix: br.com.CATECISMO
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: br.com.CATECISMO.DAIGREJACAToLICA
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    CODE_SIGN_STYLE: Automatic
targets:
  Catecismo:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources/Texts, Resources/catalog.json, Resources/PrivacyInfo.xcprivacy]
    info: { path: Info.plist }
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Catecismo
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        PRIVACY_MANIFEST_FILE: Resources/PrivacyInfo.xcprivacy
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CatecismoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Catecismo
